[package]
name = "proctorlan"
version = "0.1.0"
description = "Offline LAN classroom exam proctoring"
edition = "2021"
rust-version = "1.90"

[lib]
name = "proctorlan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
uuid = { version = "1", features = ["v4"] }
argon2 = { version = "0.5", features = ["std"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["limit"] }
if-addrs = "0.15.0"
mdns-sd = "0.21.4"
sha2 = "0.11.0"

[dev-dependencies]
futures-util = "0.3.34"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = "0.30.0"

# Argon2 is deliberately slow; optimise it even in debug builds so dev logins stay snappy.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
